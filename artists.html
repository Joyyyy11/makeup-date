<script>
/* ============================================================
   妆娘列表 · 多维筛选（地区 / 预算 / 场景 / 服务方式 / 认证）
   所有计数都来自真实数据，不使用预设假数字
   ============================================================ */
(function () {
  const host = document.getElementById('artist-list');
  const rail = document.getElementById('filterRail');
  if (!host || !rail) return;

  /* ---------- 状态 ---------- */
  const state = {
    service: new Set(),   // 上门 / 到店
    district: new Set(),  // 地区名
    price: [],            // 价格区间（单选）
    scene: new Set(),     // 场景
    other: new Set(),     // verified / today
    maxPrice: 1600,
    sort: 'relevance',
  };

  /* ---------- 工具 ---------- */
  const fmt = (n) => 'HK$' + n.toLocaleString();
  const districtsOf = (a) => (a.area || '').split('/').map((s) => s.trim()).filter(Boolean);

  /* 判断是否「提供上门」：home 字段里含「上门」或「免费上门」 */
  const offersHome = (a) => /上门/.test(a.home || '');
  const offersShop = (a) => /到店/.test(a.tags ? a.tags.join('') : '') || /到店/.test(a.home || '');
  const isToday = (a) => /今日/.test(a.slots || '');

  /* ---------- 作品风格（真实来源） ----------
     场景筛选必须按「代表作图片的实际风格」判断，
     而不是化妆师自报的 styles 标签，否则会出现
     选「写真/旅拍」却全是新娘跟妆作品的情况。
     workStyles 与 works 一一对应；缺省时回落到该作品标题推定的风格。 */
  const STYLE_NAME = {
    bridal: '新娘跟妆',
    daily: '日常约会',
    photo: '写真/旅拍',
    cos: '漫展/Cosplay',
    stage: '舞台/年会',
    guofeng: '古风妆',
    men: '男士修容',
  };
  function workStyleKeys(a) {
    const keys = new Set();
    (a.works || []).forEach((w, i) => {
      const k = (a.workStyles || [])[i];
      if (k) keys.add(k);
    });
    if (!keys.size) (a.styles || []).forEach((s) => keys.add(s));
    return [...keys];
  }
  /* 化妆师可接的场景 = 会做的妆型 ∩ 作品里真的有的类型。
     这样标签与图片不会互相矛盾。 */
  function sceneKeysOf(a) {
    const keys = workStyleKeys(a).map((k) => STYLE_NAME[k] || k);
    return [...new Set(keys)];
  }
  /* 该化妆师在该场景下真正拿得出手的作品 */
  function worksForScene(a, sceneName) {
    const out = [];
    (a.works || []).forEach((w, i) => {
      const k = (a.workStyles || [])[i];
      if (!k) return;
      if ((STYLE_NAME[k] || k) === sceneName) out.push(i);
    });
    return out;
  }

  /* ---------- 动态生成地区与场景选项（带真实计数） ---------- */
  function buildOptions() {
    // 地区计数
    const dCount = {};
    ARTISTS.forEach((a) => districtsOf(a).forEach((d) => (dCount[d] = (dCount[d] || 0) + 1)));
    const dHost = document.getElementById('districtChips');
    if (dHost) {
      dHost.innerHTML = Object.entries(dCount)
        .sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]))
        .map(
          ([d, c]) =>
            `<button class="fchip" data-fval="${d}">${d}<em>${c}</em></button>`
        )
        .join('');
    }

    // 场景计数（按作品实际风格，而不是自报 styles）
    const sCount = {};
    ARTISTS.forEach((a) => sceneKeysOf(a).forEach((s) => (sCount[s] = (sCount[s] || 0) + 1)));
    const sHost = document.getElementById('sceneChips');
    if (sHost) {
      sHost.innerHTML = Object.entries(sCount)
        .sort((x, y) => y[1] - x[1])
        .map(
          ([s, c]) =>
            `<button class="fchip" data-fval="${s}">${s}<em>${c}</em></button>`
        )
        .join('');
    }
  }

  /* ---------- 筛选 ---------- */
  function matches(a) {
    // 服务方式
    if (state.service.size) {
      const ok = [...state.service].some((s) => (s === '上门' ? offersHome(a) : offersShop(a)));
      if (!ok) return false;
    }
    // 地区
    if (state.district.size) {
      const ds = districtsOf(a);
      if (![...state.district].some((d) => ds.includes(d))) return false;
    }
    // 价格区间
    if (state.price.length) {
      const [lo, hi] = state.price[0];
      if (a.price < lo || a.price > hi) return false;
    }
    // 价格上限
    if (state.maxPrice < 1600 && a.price > state.maxPrice) return false;
    // 场景
    if (state.scene.size) {
      const own = sceneKeysOf(a);
      if (![...state.scene].some((s) => own.includes(s))) return false;
    }
    // 其他
    if (state.other.has('verified') && !a.verified) return false;
    if (state.other.has('today') && !isToday(a)) return false;
    return true;
  }

  function sortList(list) {
    const l = [...list];
    if (state.sort === 'rating') return l.sort((x, y) => y.rating - x.rating);
    if (state.sort === 'price') return l.sort((x, y) => x.price - y.price);
    // 综合推荐：认证优先 + 评分
    return l.sort((x, y) => (y.verified - x.verified) || y.rating - x.rating);
  }

  /* ---------- 渲染 ---------- */
  function render() {
    const list = ARTISTS.filter(matches);
    const sorted = sortList(list);

    host.innerHTML = sorted.length
      ? sorted.map(cardForFilters).join('')
      : `<div class="panel" style="padding:36px;text-align:center">
           <b style="font-size:15px">没有符合条件的化妆师</b>
           <p class="small muted mt8">试着放宽价格上限，或减少已选条件。</p>
           <button class="btn btn-dark btn-sm mt16" id="resetAll">清除全部筛选</button>
         </div>`;

    document.querySelectorAll('[data-result-count]').forEach((el) => (el.textContent = sorted.length));

    const resetBtn = document.getElementById('resetAll');
    if (resetBtn) resetBtn.addEventListener('click', resetAll);

    renderActiveChips();
    renderPager(sorted.length);
    syncURL();
    syncQuickUI();
  }

  /* 按当前已选场景，只把对应风格的作品放进卡片，
     并在卡片上加一行「作品匹配」说明 */
  function cardForFilters(a) {
    const scenes = [...state.scene];
    if (!scenes.length) return listCard(a);

    // 只保留命中场景的作品；没有则退回原卡片
    const keep = [];
    (a.works || []).forEach((w, i) => {
      const k = (a.workStyles || [])[i];
      if (k && scenes.includes(STYLE_NAME[k] || k)) keep.push(i);
    });
    if (!keep.length) return listCard(a);

    return listCard({
      ...a,
      works: keep.map((i) => a.works[i]),
      workCaptions: keep.map((i) => (a.workCaptions || [])[i]).filter(Boolean),
      workStyles: keep.map((i) => a.workStyles[i]),
      _why: keep.map((i) => `作品：${(a.workCaptions || [])[i]?.t || scenes[0]}`).join('|'),
    });
  }

  /* 已选条件回显 */
  function renderActiveChips() {
    const box = document.getElementById('activeFilters');
    if (!box) return;
    const items = [];
    state.service.forEach((v) => items.push(['service', v, v]));
    state.district.forEach((v) => items.push(['district', v, v]));
    state.scene.forEach((v) => items.push(['scene', v, v]));
    state.other.forEach((v) =>
      items.push(['other', v, v === 'verified' ? '实名认证' : '今日可约'])
    );
    if (state.price.length) {
      const [lo, hi] = state.price[0];
      items.push(['price', 'range', hi >= 99999 ? `${fmt(lo)} 以上` : `${fmt(lo)} – ${fmt(hi)}`]);
    }
    if (state.maxPrice < 1600) items.push(['maxp', 'maxp', `≤ ${fmt(state.maxPrice)}`]);

    // 没有任何条件时：必须清空 DOM，否则旧的「已选」标签会残留在页面里
    if (!items.length) {
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }
    box.style.display = 'flex';
    box.innerHTML =
      `<span class="xs muted" style="align-self:center">已选：</span>` +
      items
        .map(([k, v, label], i) => `<button class="af-chip" data-k="${k}" data-v="${v}" data-i="${i}">${label}<em>×</em></button>`)
        .join('') +
      `<button class="af-clear" id="afClear">清除全部</button>`;
  }

  /* 分页（真实分页，每页 6 位） */
  let page = 1;
  const PER = 6;
  function renderPager(total) {
    const pager = document.getElementById('pager');
    if (!pager) return;
    const pages = Math.ceil(total / PER) || 1;
    if (pages <= 1) { pager.innerHTML = ''; return; }
    let html = `<button class="btn btn-light btn-sm" data-pg="${Math.max(1, page - 1)}" ${page === 1 ? 'disabled' : ''}>‹</button>`;
    for (let i = 1; i <= pages; i++) {
      html += `<button class="btn ${i === page ? 'btn-dark' : 'btn-light'} btn-sm" data-pg="${i}">${i}</button>`;
    }
    html += `<button class="btn btn-light btn-sm" data-pg="${Math.min(pages, page + 1)}" ${page === pages ? 'disabled' : ''}>›</button>`;
    pager.innerHTML = html;
  }

  /* ---------- 事件 ---------- */
  // 筛选 chip 点击
  rail.addEventListener('click', (e) => {
    const chip = e.target.closest('.fchip');
    if (!chip) return;
    const group = chip.closest('[data-fkey]');
    if (!group) return;
    const key = group.dataset.fkey;

    if (key === 'price') {
      const lo = +chip.dataset.fmin, hi = +chip.dataset.fmax;
      const on = chip.classList.contains('on');
      group.querySelectorAll('.fchip').forEach((c) => c.classList.remove('on'));
      state.price = on ? [] : [[lo, hi]];
      if (!on) chip.classList.add('on');
      page = 1; render(); return;
    }

    const val = chip.dataset.fval;
    const set = state[key];
    if (!set) return;
    if (set.has(val)) { set.delete(val); chip.classList.remove('on'); }
    else { set.add(val); chip.classList.add('on'); }
    page = 1; render();
  });

  // 移除已选条件
  document.getElementById('activeFilters')?.addEventListener('click', (e) => {
    if (e.target.closest('#afClear')) { resetAll(); return; }
    const c = e.target.closest('.af-chip');
    if (!c) return;
    const k = c.dataset.k, v = c.dataset.v;
    if (k === 'price') state.price = [];
    else if (k === 'maxp') { state.maxPrice = 1600; const r = document.getElementById('priceRange'); if (r) r.value = 1600; const o = document.getElementById('priceOut'); if (o) o.textContent = '不限'; }
    else if (state[k] && state[k].delete) state[k].delete(v);
    syncChipUI();
    page = 1; render();
  });

  // 价格滑块
  const range = document.getElementById('priceRange');
  const out = document.getElementById('priceOut');
  range?.addEventListener('input', () => {
    state.maxPrice = +range.value;
    out.textContent = state.maxPrice >= 1600 ? '不限' : fmt(state.maxPrice);
    page = 1; render();
  });

  // 排序
  document.querySelectorAll('[data-sort]').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-sort]').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      state.sort = b.dataset.sort;
      page = 1; render();
    });
  });

  // 分页
  document.getElementById('pager')?.addEventListener('click', (e) => {
    const b = e.target.closest('[data-pg]');
    if (!b || b.disabled) return;
    page = +b.dataset.pg;
    render();
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ---------- 工具：UI 与 URL 同步 ---------- */
  function syncChipUI() {
    rail.querySelectorAll('[data-fkey]').forEach((g) => {
      const key = g.dataset.fkey;
      g.querySelectorAll('.fchip').forEach((c) => {
        if (key === 'price') {
          const on = state.price.length && +c.dataset.fmin === state.price[0][0];
          c.classList.toggle('on', !!on);
        } else if (state[key]) {
          c.classList.toggle('on', state[key].has(c.dataset.fval));
        }
      });
    });
  }

  function syncURL() {
    const p = new URLSearchParams();
    const put = (k, arr) => { if (arr.length) p.set(k, arr.join(',')); };
    put('service', [...state.service]);
    put('district', [...state.district]);
    put('scene', [...state.scene]);
    put('other', [...state.other]);
    if (state.price.length) p.set('price', state.price[0].join('-'));
    if (state.maxPrice < 1600) p.set('max', state.maxPrice);
    if (state.sort !== 'relevance') p.set('sort', state.sort);
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  function resetAll() {
    state.service.clear(); state.district.clear(); state.scene.clear();
    state.other.clear(); state.price = []; state.maxPrice = 1600;
    if (range) range.value = 1600;
    if (out) out.textContent = '不限';
    syncChipUI();
    page = 1; render();
  }

  /* ---------- 从 URL 恢复筛选（可分享） ---------- */
  function readURL() {
    const p = new URLSearchParams(location.search);
    (p.get('service') || '').split(',').filter(Boolean).forEach((v) => state.service.add(v));
    (p.get('district') || '').split(',').filter(Boolean).forEach((v) => state.district.add(v));
    (p.get('scene') || '').split(',').filter(Boolean).forEach((v) => state.scene.add(v));
    (p.get('other') || '').split(',').filter(Boolean).forEach((v) => state.other.add(v));
    const pr = p.get('price');
    if (pr && pr.includes('-')) {
      const [lo, hi] = pr.split('-').map(Number);
      state.price = [[lo, hi]];
    }
    const mx = p.get('max');
    if (mx) { state.maxPrice = +mx; if (range) range.value = state.maxPrice; if (out) out.textContent = fmt(state.maxPrice); }
    const s = p.get('sort');
    if (s) {
      state.sort = s;
      document.querySelectorAll('[data-sort]').forEach((x) => x.classList.toggle('active', x.dataset.sort === s));
    }
  }

  /* ---------- 顶部搜索条：直接在本页筛选 ---------- */
  const quickDistrict = document.getElementById('quickDistrict');
  const quickScene = document.getElementById('quickScene');
  const quickBudget = document.getElementById('quickBudget');

  // 下拉选项用真实数据填充
  function buildQuickOptions() {
    if (quickDistrict) {
      const set = new Set();
      ARTISTS.forEach((a) => districtsOf(a).forEach((d) => set.add(d)));
      quickDistrict.innerHTML =
        '<option value="">全部地区</option>' +
        [...set].sort((x, y) => x.localeCompare(y)).map((d) => `<option value="${d}">${d}</option>`).join('');
    }
    if (quickScene) {
      const set = new Set();
      ARTISTS.forEach((a) => sceneKeysOf(a).forEach((s) => set.add(s)));
      quickScene.innerHTML =
        '<option value="">全部风格</option>' +
        [...set].map((s) => `<option value="${s}">${s}</option>`).join('');
    }
  }

  /* ---------- 启动 ---------- */
  buildOptions();
  buildQuickOptions();
  readURL();
  syncChipUI();
  render();

  /* ---------- 移动端：把筛选栏变成底部抽屉 ---------- */
  const aside = rail.parentElement;
  const openBtn = document.getElementById('openFilter');
  let mask = null;

  function ensureMask() {
    if (mask) return mask;
    mask = document.createElement('div');
    mask.className = 'filter-mask';
    mask.addEventListener('click', closeDrawer);
    document.body.appendChild(mask);
    return mask;
  }

  function openDrawer() {
    aside.classList.add('drawer-open');
    rail.classList.add('as-drawer');
    ensureMask().classList.add('on');
    document.body.style.overflow = 'hidden';
    // 抽屉内的关闭按钮
    if (!rail.querySelector('.drawer-close')) {
      const btn = document.createElement('button');
      btn.className = 'drawer-close';
      btn.innerHTML = '完成 <em>✓</em>';
      btn.addEventListener('click', closeDrawer);
      rail.insertBefore(btn, rail.firstChild);
    }
  }

  function closeDrawer() {
    aside.classList.remove('drawer-open');
    rail.classList.remove('as-drawer');
    if (mask) mask.classList.remove('on');
    document.body.style.overflow = '';
  }

  openBtn?.addEventListener('click', openDrawer);
  window.addEventListener('resize', () => {
    if (window.innerWidth > 1000) closeDrawer();
  });

  /* ---------- 顶部搜索条：直接在本页筛选 ---------- */
  // 下拉 -> 筛选状态
  quickDistrict?.addEventListener('change', () => {
    state.district.clear();
    if (quickDistrict.value) state.district.add(quickDistrict.value);
    syncChipUI(); page = 1; render();
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  quickScene?.addEventListener('change', () => {
    state.scene.clear();
    if (quickScene.value) state.scene.add(quickScene.value);
    syncChipUI(); page = 1; render();
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  quickBudget?.addEventListener('change', () => {
    state.price = quickBudget.value ? [quickBudget.value.split('-').map(Number)] : [];
    syncChipUI(); page = 1; render();
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 日期：点击循环切换 11/14 → 11/15 → ... → 不限
  let quickDateIdx = 0;
  const QUICK_DATES = ['11 月 14 日', '11 月 15 日', '11 月 21 日', '不限日期'];
  document.getElementById('quickDateText')?.parentElement?.addEventListener('click', () => {
    quickDateIdx = (quickDateIdx + 1) % QUICK_DATES.length;
    const txt = document.getElementById('quickDateText');
    if (txt) txt.textContent = QUICK_DATES[quickDateIdx];
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 侧栏状态变化时，反向同步到顶部下拉
  function syncQuickUI() {
    if (quickDistrict) {
      const d = [...state.district][0] || '';
      // 侧栏可多选，下拉只显示第一个
      if (![...quickDistrict.options].some((o) => o.value === d)) {
        if (d) quickDistrict.add(new Option(d, d));
      }
      quickDistrict.value = d;
    }
    if (quickScene) {
      const s = [...state.scene][0] || '';
      if (s && ![...quickScene.options].some((o) => o.value === s)) quickScene.add(new Option(s, s));
      quickScene.value = s;
    }
    if (quickBudget) {
      quickBudget.value = state.price.length ? state.price[0].join('-') : '';
    }
  }

  /* ---------- 搜索跳转：把当前筛选条件转成关键词 ----------
     进入搜索页时不能再沿用写死的「新娘 跟妆」，
     而是用用户在这一页挑的场景 / 地区 / 服务方式 / 价格生成 q。 */
  function searchQuery() {
    const parts = [];
    // 场景优先：直接就是关键词（如「写真/旅拍」）
    state.scene.forEach((v) => parts.push(v));
    // 服务方式：上门 / 到店
    state.service.forEach((v) => parts.push(v));
    // 地区
    state.district.forEach((v) => parts.push(v));
    // 其他：今日可约
    if (state.other.has('today')) parts.push('今日可约');
    return [...new Set(parts)].join(' ');
  }

  function goSearch() {
    const p = new URLSearchParams();
    const q = searchQuery();
    // 有关键词才带 q；否则用「全部」表示不限，避免搜索页回落到默认词
    p.set('q', q || '全部');
    if (state.district.size) p.set('district', [...state.district].join(','));
    if (state.scene.size) p.set('scene', [...state.scene].join(','));
    if (state.service.size) p.set('service', [...state.service].join(','));
    if (state.other.has('today')) p.set('today', '1');
    if (state.price.length) p.set('price', state.price[0].join('-'));
    if (state.maxPrice < 1600) p.set('max', state.maxPrice);
    if (state.sort !== 'relevance') p.set('sort', state.sort);
    location.href = 'search.html?' + p.toString();
  }

  ['goSearch', 'goSearchMini'].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => {
      e.preventDefault();
      // 搜索按钮 = 在本页应用筛选，不跳页
      page = 1;
      render();
      host.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const first = host.querySelector('article');
      if (first) {
        first.animate(
          [{ boxShadow: '0 0 0 2px rgba(197,160,89,.55)' }, { boxShadow: '0 0 0 0 rgba(197,160,89,0)' }],
          { duration: 900, easing: 'ease-out' }
        );
      }
    });
  });
})();
</script>
</body>
</html>
